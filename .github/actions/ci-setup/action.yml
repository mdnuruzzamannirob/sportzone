name: Locked CI setup
description: Recorded Node/npm toolchain with download cache and a locked script-free install
runs:
  using: composite
  steps:
    - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: package-lock.json
        package-manager-cache: false
    - name: Select recorded npm
      shell: bash
      run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
    - name: Locked install
      shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund
