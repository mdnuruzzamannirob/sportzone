name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: CI required result
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_API_ORIGIN: https://127.0.0.1:4443
      VITE_API_ORIGIN: https://127.0.0.1:4443
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
          package-manager-cache: false
      - name: Select recorded npm
        run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - name: Locked install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install browser audit engines
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Run required checks
        run: npm run ci
      - name: Preserve reports and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
