name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: CI required result
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_API_ORIGIN: https://127.0.0.1:4443
      VITE_API_ORIGIN: https://127.0.0.1:4443
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
          package-manager-cache: false
      - name: Select recorded npm
        run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - name: Locked install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Select affected checks
        id: affected
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/affected.mjs
      - name: Install browser audit engines
        if: steps.affected.outputs.browser == 'true'
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Run required checks
        env:
          CI_SCOPE: ${{ steps.affected.outputs.scope }}
        run: npm run ci -- --scope="$CI_SCOPE"
      - name: Preserve reports and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
