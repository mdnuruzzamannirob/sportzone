name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: CI required result
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
          package-manager-cache: false
      - name: Select recorded npm
        run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - name: Locked install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Select affected checks
        id: affected
        env:
          # Remove this stage restriction when frontend/browser stages resume.
          CI_BACKEND_ONLY: 'true'
          CI_EVENT: ${{ github.event_name }}
          CI_FORCE_ALL: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/affected.mjs
      - name: Run affected checks for the active application stage
        env:
          CI_SCOPE: ${{ steps.affected.outputs.scope }}
        run: npm run ci -- --scope="$CI_SCOPE"
      - name: Verify affected backend image
        if: steps.affected.outputs.container == 'true'
        run: node scripts/ci/container.mjs
      - name: Preserve reports and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
