# Generated topology; verify with npm run ci:workflow after inventory changes.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    uses: ./.github/workflows/ci-scope.yml
    with:
      scope: repository
  storefront:
    needs: [repository]
    uses: ./.github/workflows/ci-scope.yml
    with:
      scope: storefront
  admin:
    needs: [repository]
    uses: ./.github/workflows/ci-scope.yml
    with:
      scope: admin
  backend:
    needs: [repository]
    uses: ./.github/workflows/ci-scope.yml
    with:
      scope: backend
  browser:
    needs: [storefront, admin]
    uses: ./.github/workflows/ci-scope.yml
    with:
      scope: browser
      prepare: true
  supply-chain:
    needs: [repository]
    uses: ./.github/workflows/ci-scope.yml
    with:
      scope: supply-chain
  required-result:
    name: CI required result
    if: ${{ always() }}
    needs: [repository, storefront, admin, backend, browser, supply-chain]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ci-*-${{ github.run_attempt }}
          path: test-results
          merge-multiple: true
      - name: Verify every job and current-run report
        if: ${{ always() }}
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: npm run ci -- --aggregate
      - name: Preserve aggregate
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-result-${{ github.run_attempt }}
          path: test-results/ci.json
          if-no-files-found: error
